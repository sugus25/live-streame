<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WEITV Online</title>
    
    <!-- Professional Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Power Engines for .ts, .bin, and .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>

    <style>
        :root { --blue: #66BAFF; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        
        #player-wrapper { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        
        /* ========== VIDEO & ASPECT RATIO — ปรับขนาดวิดีโอ ========== */
        video { 
            width: 100%; height: 100%; 
            object-fit: contain;       /* โหมด 1: ปกติ — ไม่ตัดภาพ ไม่มีการยืด */
            z-index: 1; 
            transition: all 0.3s ease;
        }
        
        /* โหมด 2: เต็มจอเต็มพื้นที่ — ยืดเต็มขอบ อาจบิดเบี้ยว */
        video.aspect-fill { object-fit: fill !important; }
        
        /* โหมด 3: ครอบเต็มจอ — ตัดขอบดำออก ภาพเต็มจอ */
        video.aspect-zoom { object-fit: cover !important; }
        
        /* โหมด 4: 16:9 มาตรฐาน */
        video.aspect-16x9 { 
            width: 100%; height: auto; 
            max-height: 100vh; 
            aspect-ratio: 16/9; 
            object-fit: contain; 
        }
        
        /* โหมด 5: 4:3 มาตรฐาน */
        video.aspect-4x3 { 
            width: auto; height: 100%; 
            max-width: 100vw; 
            aspect-ratio: 4/3; 
            object-fit: contain; 
        }
        
        /* โหมด 6: ซูมเข้า — ขยายภาพเล็กน้อย ตัดขอบดำ */
        video.aspect-zoom-fit { 
            object-fit: contain; 
            transform: scale(1.05); 
        }

        /* UI OVERLAY */
        #ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; background: rgba(0,0,0,0.2); pointer-events: none; }
        #ui-layer * { pointer-events: auto; }

        /* 1. TOP LAYER */
        .layer-top { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); margin: -20px -20px 0 -20px; padding: 20px; }
        .back-btn { font-size: 24px; cursor: pointer; }
        .title { font-weight: 800; font-size: 20px; letter-spacing: 1px; }
        .aspect-indicator { font-size: 12px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 12px; color: var(--blue); font-weight: 600; }

        /* 2. MIDDLE LAYER */
        .layer-middle { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .mid-controls { display: flex; align-items: center; gap: 40px; }
        .icon-lg { font-size: 45px; text-shadow: 0 0 10px black; cursor: pointer; }
        
        /* Gestures (Brightness/Volume) */
        .gesture-bar { position: absolute; top: 50%; transform: translateY(-50%); width: 4px; height: 150px; background: rgba(255,255,255,0.2); border-radius: 10px; opacity: 0; transition: opacity 0.3s; }
        .bar-fill { width: 100%; background: var(--blue); position: absolute; bottom: 0; border-radius: 10px; }
        .bar-thumb { width: 14px; height: 14px; background: var(--blue); border-radius: 50%; position: absolute; left: -5px; bottom: 50%; }
        .side-icon { position: absolute; bottom: -35px; left: -10px; font-size: 20px; }

        /* Loading Spinner */
        #spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.2); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 3. SECOND TO BOTTOM */
        .layer-seekbar { display: flex; align-items: center; gap: 15px; padding: 0 10px; margin-bottom: 10px; }
        .time { font-size: 14px; width: 45px; text-align: center; }
        .seek-base { flex: 1; height: 5px; background: rgba(255,255,255,0.3); position: relative; border-radius: 5px; cursor: pointer; }
        .seek-fill { height: 100%; background: var(--blue); width: 0%; border-radius: 5px; }
        .seek-thumb { width: 16px; height: 16px; background: var(--blue); border-radius: 50%; position: absolute; top: -6px; margin-left: -8px; left: 0%; }

        /* 4. LAST BOTTOM — เพิ่มปุ่มปรับขนาด + เมนูตัวเลือก */
        .layer-tools { display: flex; justify-content: flex-end; gap: 25px; align-items: center; padding-right: 10px; position: relative; }
        .tool-icon { font-size: 24px; cursor: pointer; transition: 0.2s; }
        .tool-icon:hover { color: var(--blue); transform: scale(1.1); }
        
        /* === ASPECT RATIO MENU — เมนูเลือกขนาดภาพ === */
        .aspect-menu {
            position: absolute; bottom: 50px; right: 10px;
            background: rgba(10, 10, 20, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 160px;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: none;
        }
        .aspect-menu.show { display: block; }
        .aspect-option {
            padding: 12px 18px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .aspect-option:hover { background: rgba(102, 186, 255, 0.2); }
        .aspect-option.active { color: var(--blue); font-weight: 600; background: rgba(102, 186, 255, 0.1); }
        .aspect-option i { font-size: 12px; }

        /* UTILS */
        #brightness-mask { position: fixed; inset: 0; background: black; pointer-events: none; z-index: 5; opacity: 0; }
        .hide { display: none !important; }
    </style>
</head>
<body>

    <div id="brightness-mask"></div>

    <div id="player-wrapper" onclick="showUI()">
        <video id="video" playsinline></video>

        <div id="ui-layer">
            <!-- 1. TOP -->
            <div class="layer-top">
                <i class="fa-solid fa-chevron-left back-btn" onclick="history.back()"></i>
                <div class="title">WEITV</div>
                <div class="aspect-indicator" id="aspectLabel">เต็มจอ</div>
            </div>

            <!-- 2. MIDDLE -->
            <div class="layer-middle">
                <!-- Left: Brightness -->
                <div id="bBar" class="gesture-bar" style="left: 10px;">
                    <div id="bFill" class="bar-fill"></div>
                    <div id="bThumb" class="bar-thumb"></div>
                    <i class="fa-solid fa-sun side-icon"></i>
                </div>

                <div class="mid-controls">
                    <i class="fa-solid fa-backward-step icon-lg" onclick="seekVideo(-10)"></i>
                    <div id="spinner"></div>
                    <i id="playBtn" class="fa-solid fa-play icon-lg" onclick="togglePlay()"></i>
                    <i class="fa-solid fa-forward-step icon-lg" onclick="seekVideo(10)"></i>
                </div>

                <!-- Right: Volume -->
                <div id="vBar" class="gesture-bar" style="right: 10px;">
                    <div id="vFill" class="bar-fill"></div>
                    <div id="vThumb" class="bar-thumb"></div>
                    <i class="fa-solid fa-volume-high side-icon"></i>
                </div>
            </div>

            <!-- BOTTOM AREA -->
            <div>
                <!-- 3. SECOND TO BOTTOM -->
                <div class="layer-seekbar">
                    <span id="curTime" class="time">00:00</span>
                    <div class="seek-base" id="seekBase" onclick="manualSeek(event)">
                        <div id="seekFill" class="seek-fill"></div>
                        <div id="seekThumb" class="seek-thumb"></div>
                    </div>
                    <span id="durTime" class="time">00:00</span>
                </div>

                <!-- 4. LAST BOTTOM — เพิ่มเมนูปรับขนาด -->
                <div class="layer-tools">
                    <i class="fa-solid fa-rotate tool-icon" onclick="rotateToggle()"></i>
                    <i class="fa-solid fa-clone tool-icon" onclick="togglePiP()"></i>
                    <i class="fa-solid fa-tower-broadcast tool-icon" onclick="alert('Cast Active')"></i>
                    
                    <!-- ปุ่มเปิดเมนูปรับขนาดภาพ -->
                    <i class="fa-solid fa-expand tool-icon" id="aspectBtn" onclick="toggleAspectMenu()"></i>
                    
                    <!-- เมนูเลือกขนาดภาพ -->
                    <div class="aspect-menu" id="aspectMenu">
                        <div class="aspect-option active" data-mode="contain" onclick="setAspect('contain', 'เต็มจอ')">
                            <span>เต็มจอ (ไม่ตัดขอบ)</span>
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div class="aspect-option" data-mode="fill" onclick="setAspect('fill', 'ยืดเต็มจอ')">
                            <span>ยืดเต็มจอ</span>
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div class="aspect-option" data-mode="cover" onclick="setAspect('cover', 'ครอบเต็มจอ')">
                            <span>ครอบเต็มจอ (ไม่มีขอบดำ)</span>
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div class="aspect-option" data-mode="aspect-16x9" onclick="setAspect('aspect-16x9', '16:9')">
                            <span>16:9 มาตรฐาน</span>
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div class="aspect-option" data-mode="aspect-4x3" onclick="setAspect('aspect-4x3', '4:3')">
                            <span>4:3 มาตรฐาน</span>
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div class="aspect-option" data-mode="aspect-zoom-fit" onclick="setAspect('aspect-zoom-fit', 'ซูมตัดขอบ')">
                            <span>ซูมตัดขอบดำ</span>
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const video = document.getElementById('video');
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');

    if (!url) { alert("Error: No Stream URL"); window.location.href = 'index.html'; }

    // --- ENGINE SELECTION (.ts, .bin, .m3u8) ---
    function initEngine() {
        if (url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                const hls = new Hls(); hls.loadSource(url); hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        } else if (url.includes('.ts') || url.includes('.bin') || url.includes('mpegts')) {
            if (mpegts.getFeatureList().mseLivePlayback) {
                const player = mpegts.createPlayer({ type: 'mse', isLive: true, url: url });
                player.attachMediaElement(video); player.load();
            }
        } else {
            video.src = url;
        }
        video.play().catch(() => { /* Autoplay blocked */ });
    }

    // --- PLAYER CONTROLS ---
    function togglePlay() {
        if (video.paused) { video.play(); } else { video.pause(); }
    }
    video.onplay = () => document.getElementById('playBtn').className = "fa-solid fa-pause icon-lg";
    video.onpause = () => document.getElementById('playBtn').className = "fa-solid fa-play icon-lg";

    function seekVideo(val) { video.currentTime += val; }

    // ========== ASPECT RATIO CONTROLS — ฟังก์ชันปรับขนาดวิดีโอ ==========
    let currentAspectMode = 'contain'; // ค่าเริ่มต้น
    
    // เปิด/ปิด เมนูเลือกขนาด
    function toggleAspectMenu() {
        const menu = document.getElementById('aspectMenu');
        menu.classList.toggle('show');
    }
    
    // ตั้งค่าขนาดวิดีโอ
    function setAspect(mode, label) {
        // ลบคลาสทั้งหมดก่อน
        video.classList.remove('aspect-fill', 'aspect-zoom', 'aspect-16x9', 'aspect-4x3', 'aspect-zoom-fit');
        video.style.objectFit = '';
        
        // ตั้งค่าโหมดใหม่
        if (mode === 'contain') {
            video.style.objectFit = 'contain';
        } else if (mode === 'fill') {
            video.style.objectFit = 'fill';
        } else if (mode === 'cover') {
            video.style.objectFit = 'cover';
        } else {
            video.classList.add(mode);
        }
        
        // อัปเดตสถานะ
        currentAspectMode = mode;
        document.getElementById('aspectLabel').textContent = label;
        
        // อัปเดตเมนู — ใส่เครื่องหมายถูก
        document.querySelectorAll('.aspect-option').forEach(opt => {
            opt.classList.remove('active');
            opt.querySelector('i').style.opacity = '0';
        });
        const activeOpt = document.querySelector(`.aspect-option[data-mode="${mode}"]`);
        if (activeOpt) {
            activeOpt.classList.add('active');
            activeOpt.querySelector('i').style.opacity = '1';
        }
        
        // ปิดเมนู
        document.getElementById('aspectMenu').classList.remove('show');
    }
    
    // ปิดเมนูเมื่อกดที่อื่น
    document.addEventListener('click', (e) => {
        const btn = document.getElementById('aspectBtn');
        const menu = document.getElementById('aspectMenu');
        if (!btn.contains(e.target) && !menu.contains(e.target)) {
            menu.classList.remove('show');
        }
    });

    function togglePiP() { if (document.pictureInPictureEnabled) video.requestPictureInPicture(); }

    // --- SEEKBAR LOGIC ---
    video.ontimeupdate = () => {
        const p = (video.currentTime / video.duration) * 100;
        document.getElementById('seekFill').style.width = p + '%';
        document.getElementById('seekThumb').style.left = p + '%';
        document.getElementById('curTime').innerText = formatTime(video.currentTime);
        document.getElementById('durTime').innerText = formatTime(video.duration);
    };

    function formatTime(s) {
        if (isNaN(s)) return "00:00";
        let m = Math.floor(s / 60); s = Math.floor(s % 60);
        return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    function manualSeek(e) {
        const rect = document.getElementById('seekBase').getBoundingClientRect();
        const p = (e.clientX - rect.left) / rect.width;
        video.currentTime = p * video.duration;
    }

    // --- GESTURES (Brightness/Volume) ---
    let brightness = 100;
    const wrapper = document.getElementById('player-wrapper');
    wrapper.addEventListener('touchstart', (e) => {
        const startX = e.touches[0].clientX;
        const startY = e.touches[0].clientY;
        const isLeft = startX < window.innerWidth / 2;
        const startVal = isLeft ? brightness : video.volume * 100;
        const bar = isLeft ? document.getElementById('bBar') : document.getElementById('vBar');
        const fill = isLeft ? document.getElementById('bFill') : document.getElementById('vFill');
        const thumb = isLeft ? document.getElementById('bThumb') : document.getElementById('vThumb');

        const move = (m) => {
            bar.style.opacity = 1;
            let delta = (startY - m.touches[0].clientY) / 2;
            let nV = Math.min(100, Math.max(0, startVal + delta));
            fill.style.height = nV + '%'; thumb.style.bottom = nV + '%';
            if (isLeft) {
                brightness = nV; document.getElementById('brightness-mask').style.opacity = (100 - nV) / 130;
            } else { video.volume = nV / 100; }
        };
        const end = () => { bar.style.opacity = 0; wrapper.removeEventListener('touchmove', move); };
        wrapper.addEventListener('touchmove', move); wrapper.addEventListener('touchend', end);
    });

    // --- UI AUTO-HIDE ---
    let uiTimer;
    function showUI() {
        document.getElementById('ui-layer').classList.remove('hide');
        clearTimeout(uiTimer);
        uiTimer = setTimeout(() => document.getElementById('ui-layer').classList.add('hide'), 5000);
    }

    // Loading State
    video.onwaiting = () => document.getElementById('spinner').style.display = 'block';
    video.onplaying = () => document.getElementById('spinner').style.display = 'none';

    initEngine();
    showUI();
</script>
</body>
</html>
