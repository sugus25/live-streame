<script>
"use strict";
if(window.shaka && shaka.polyfill) shaka.polyfill.installAll();

/* ---------------- Hardcoded URL ---------------- */
const FIXED_SERVER_URL = "http://mooseven.ddns.net:8080";

/* ---------------- Banner Logic ---------------- */
const slides=document.querySelectorAll(".slide"), dots=document.querySelectorAll("#sliderDots span");
let curSlide=0;
setInterval(()=>{
  slides[curSlide].classList.remove("active"); dots[curSlide].classList.remove("active");
  curSlide = (curSlide+1)%slides.length;
  slides[curSlide].classList.add("active"); dots[curSlide].classList.add("active");
}, 5000);

/* ---------------- State ---------------- */
const S = { 
  url: FIXED_SERVER_URL, user:"", pass:"", type:"live", cats:[], catId:null, items:[], 
  hls:null, shaka:null, eps:[], epIndex:-1, series:null, currentSrc:"",
  showAdult: false,
  m3uLinks: [], 
  m3uData: { cats:[], items:{} }
};

async function loadAllM3U() {
  S.m3uData = { cats:[], items:{} };
  for(let i=0; i<S.m3uLinks.length; i++){
    let text = "";
    let url = S.m3uLinks[i];
    
    try {
      const r1 = await fetch(url);
      if(!r1.ok) throw new Error();
      text = await r1.text();
    } catch(e1) {
      try {
        const r2 = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
        if(!r2.ok) throw new Error();
        text = await r2.text();
      } catch(e2) {
        try {
          const r3 = await fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url));
          if(!r3.ok) throw new Error();
          text = await r3.text();
        } catch(e3) {
          console.error("M3U Load Failed:", url);
          continue; 
        }
      }
    }
    
    if(text && text.includes("#EXTINF")) {
      parseM3UContent(text, i);
    }
  }
}

function parseM3UContent(text, srcIndex) {
  const lines = text.split(/\r?\n/);
  let curItem = {};
  
  for(let line of lines){
    line = line.trim();
    if(!line) continue;
    
    if(line.startsWith("#EXTINF:")){
      curItem = { name: "Unknown", cover: "", group: "M3U Playlist "+(srcIndex+1), isM3U: true };
      
      const groupMatch = line.match(/group-title="([^"]+)"/) || line.match(/group-title=([^, ]+)/);
      if(groupMatch) curItem.group = groupMatch[1];
      
      const logoMatch = line.match(/tvg-logo="([^"]+)"/) || line.match(/tvg-logo=([^, ]+)/);
      if(logoMatch) curItem.cover = logoMatch[1];
      
      const commaIdx = line.indexOf(',');
      if(commaIdx > -1){
        curItem.name = line.substring(commaIdx + 1).trim();
      } else {
        curItem.name = "Channel";
      }
      
    } else if(!line.startsWith("#")){
      if(curItem.name) {
        curItem.stream_id = line; 
        
        const catId = "m3u_" + srcIndex + "_" + encodeURIComponent(curItem.group || "Uncategorized").replace(/%/g, '_');
        
        if(!S.m3uData.cats.find(c=>c.category_id===catId)){
          S.m3uData.cats.push({ category_id: catId, category_name: "[M3U] " + (curItem.group || "Uncategorized"), isM3U: true });
          S.m3uData.items[catId] = [];
        }
        S.m3uData.items[catId].push(curItem);
        curItem = {}; 
      }
    }
  }
}

function renderItems(list, isSearch, page = 1){
  list = list || S.items;
  currentRenderList = list; 
  const isLive = S.type === "live"; 
  $("content").innerHTML = "";
  
  if(!list.length){ $("content").innerHTML='<div class="empty">ไม่มีรายการ</div>'; return; }
  
  const isPaginated = (S.type === "vod" || S.type === "series");
  let displayList = list;
  let totalPages = 1;

  if(isPaginated){
    totalPages = Math.ceil(list.length / itemsPerPage) || 1;
    if(page < 1) page = 1;
    if(page > totalPages) page = totalPages;
    const start = (page - 1) * itemsPerPage;
    displayList = list.slice(start, start + itemsPerPage);
  }

  const grid = document.createElement("div"); 
  grid.className = "grid";
  displayList.forEach(it => {
    const n = it.name||it.title||"-", ico = it.stream_icon||it.cover||"";
    const d=document.createElement("div"); d.className="item"+(isLive?" live":"");
    d.innerHTML=`<img class="thumb" loading="lazy" src="${esc(ico)}" onerror="this.style.visibility='hidden'"><div class="cap">${esc(n)}</div>`;
    d.onclick = () => openItem(it); 
    grid.appendChild(d);
  });
  $("content").appendChild(grid);

  if(isPaginated && totalPages > 1){
    const pg = document.createElement("div");
    pg.className = "pagination";
    pg.innerHTML = `
      <button class="pg-btn" id="btnPrev" ${page === 1 ? 'disabled' : ''}>&laquo; ก่อนหน้า</button>
      <span class="pg-info">หน้า ${page} / ${totalPages}</span>
      <button class="pg-btn" id="btnNext" ${page === totalPages ? 'disabled' : ''}>ถัดไป &raquo;</button>
    `;
    $("content").appendChild(pg);

    if(page > 1) $("btnPrev").onclick = () => renderItems(currentRenderList, isSearch, page - 1);
    if(page < totalPages) $("btnNext").onclick = () => renderItems(currentRenderList, isSearch, page + 1);
    
    $("content").scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* Audio & Subtitle Logic ผ่าน HLS */
async function play(src, resTime=0){
  const v=$("video"); S.currentSrc=src;
  if(S.hls){S.hls.destroy();S.hls=null;}
  if(S.shaka){try{await S.shaka.destroy();}catch(e){} S.shaka=null;}
  v.pause(); v.removeAttribute("src"); $("vlcNote").classList.add("hidden");
  
  const isLive = S.type==="live" || /\.m3u8/i.test(src);

  if(window.Hls && Hls.isSupported() && /\.m3u8/i.test(src)){
    const hls = new Hls(); S.hls = hls;
    hls.loadSource(src); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ v.play().catch(()=>{}); buildHlsTracks(hls); });
    hls.on(Hls.Events.LEVEL_SWITCHED, () => buildHlsTracks(hls));
    hls.on(Hls.Events.ERROR, (_,d)=>{ if(d.fatal) showPerr("ไม่สามารถเล่นสตรีมนี้ได้"); });
    return;
  }
  
  if(window.shaka && shaka.Player.isBrowserSupported() && !isLive){
    try{
      const pl = new shaka.Player(v); S.shaka = pl;
      pl.addEventListener("error", ()=>fallBackNative(v, src));
      pl.addEventListener("trackschanged", () => buildShakaTracks(pl));
      await pl.load(src);
      v.play().catch(()=>{});
      buildShakaTracks(pl);
      return;
    }catch(e){ fallBackNative(v, src); return; }
  }

  fallBackNative(v, src);
}

function fallBackNative(v, src){
  v.src = src; 
  v.onloadedmetadata = () => buildNativeTracks(v); 
  v.onloadeddata = () => buildNativeTracks(v); 
  v.play().catch(()=>{});
  v.onerror = () => showPerr("เบราว์เซอร์ไม่รองรับไฟล์วิดีโอนี้ (MKV/TS) กรุณากดปุ่ม 🎬 เปิดใน drm.player");
}

function showPerr(m){ const e=$("playerErr"); e.textContent=m; e.classList.remove("hidden"); }

function setSelect(el, opts, cur, en){
  el.innerHTML=opts.map(o=>`<option value="${o.value}" ${String(o.value)===String(cur)?"selected":""}>${esc(o.label)}</option>`).join("");
  el.disabled=!en;
}

function buildHlsTracks(hls){
  if(hls.audioTracks && hls.audioTracks.length>1){
    setSelect($("audioSel"), hls.audioTracks.map((t,i)=>({value:i,label:t.name||t.lang||"เสียง "+(i+1)})), hls.audioTrack, true);
    $("audioSel").onchange=e=>hls.audioTrack=parseInt(e.target.value);
  } else {
    setSelect($("audioSel"),[{value:0,label:"ต้นฉบับ"}],0,false);
  }
  if(hls.subtitleTracks && hls.subtitleTracks.length){
    const opt=[{value:-1,label:"ปิด"}].concat(hls.subtitleTracks.map((t,i)=>({value:i,label:t.name||t.lang||"ซับ "+(i+1)})));
    setSelect($("subSel"), opt, hls.subtitleTrack, true);
    $("subSel").onchange=e=>{ const v=parseInt(e.target.value); hls.subtitleTrack=v; hls.subtitleDisplay=(v>=0); };
  } else {
    setSelect($("subSel"),[{value:-1,label:"ไม่มีซับ"}],-1,false);
  }
}

function buildShakaTracks(pl){
  const langs = pl.getAudioLanguagesAndRoles(); 
  if(langs.length > 1){
    const cur = (pl.getVariantTracks().find(t=>t.active)||{}).language;
    const uniqueLangs = [...new Map(langs.map(l => [l.language, l])).values()];
    setSelect($("audioSel"), uniqueLangs.map((l,i)=>({value:l.language,label:l.language||"เสียง "+(i+1)})), cur, true);
    $("audioSel").onchange=e=>pl.selectAudioLanguage(e.target.value);
  }
  
  const txts = pl.getTextTracks();
  if(txts.length){
    const opt=[{value:-1,label:"ปิด"}].concat(txts.map(t=>({value:t.id,label:t.label||t.language||"ซับ "+t.id})));
    setSelect($("subSel"), opt, -1, true);
    $("subSel").onchange=e=>{
      if(e.target.value==="-1"){ pl.setTextTrackVisibility(false); return; }
      const tr=pl.getTextTracks().find(t=>String(t.id)===e.target.value);
      if(tr){ pl.selectTextTrack(tr); pl.setTextTrackVisibility(true); }
    };
  }
}

function buildNativeTracks(v){
  let hasAudio = false;
  let hasSub = false;

  const at = v.audioTracks || v.mozAudioTracks || v.webkitAudioTracks;
  if(at && at.length > 1){
    hasAudio = true;
    const opt=[]; let currentActive = 0;
    for(let i=0;i<at.length;i++) {
      opt.push({value:i,label:at[i].label||at[i].language||"เสียง "+(i+1)});
      if(at[i].enabled) currentActive = i;
    }
    setSelect($("audioSel"), opt, currentActive, true);
    $("audioSel").onchange=e=>{ for(let i=0;i<at.length;i++) at[i].enabled=(i==e.target.value); };
  }

  if(v.textTracks && v.textTracks.length){
    hasSub = true;
    const opt=[{value:-1,label:"ปิด"}];
    let currentSub = -1;
    for(let i=0;i<v.textTracks.length;i++){ 
      if(v.textTracks[i].kind !== "metadata") {
        opt.push({value:i,label:v.textTracks[i].label||v.textTracks[i].language||"ซับ "+(i+1)}); 
        if(v.textTracks[i].mode === "showing") currentSub = i;
        else v.textTracks[i].mode="hidden"; 
      }
    }
    if(opt.length > 1) {
      setSelect($("subSel"), opt, currentSub, true);
      $("subSel").onchange=e=>{ 
        for(let i=0;i<v.textTracks.length;i++) {
          if(v.textTracks[i].kind !== "metadata") v.textTracks[i].mode=(i==e.target.value)?"showing":"hidden"; 
        }
      };
    }
  } 
  
  if (S.currentSrc && !/\.m3u8/i.test(S.currentSrc) && (!hasAudio || !hasSub)) {
    const n = $("vlcNote");
    n.innerHTML = "💡 วิดีโอนี้อาจมีหลายเสียง/ซับไตเติล แต่ข้อจำกัดของเบราว์เซอร์ไม่สามารถแยกแทร็กได้ 100% แนะนำให้ใช้ปุ่ม <b>📱 Google Video</b> หรือ <b>🎬 เปิดใน VLC</b> เพื่อเลือกภาษาครับ";
    n.classList.remove("hidden");
  }
}

$("closeBtn").onclick = ()=>{ $("video").pause(); $("modal").classList.add("hidden"); };

/* ==============================================================
   ฟังก์ชันควบคุมปุ่มเปิดแอป (VLC, Google Video, Windows)
   ============================================================== */

const isAndroid = /Android/i.test(navigator.userAgent);
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

// ฟังก์ชันดึง Intent เจาะจงแอป
function getAndroidIntent(pkg) {
  let m = S.currentSrc.match(/^(https?):\/\/(.*)$/i);
  let scheme = m ? m[1] : "http";
  let path = m ? m[2] : S.currentSrc;
  return `intent://${path}#Intent;scheme=${scheme};package=${pkg};type=video/*;end`;
}

// ฟังก์ชันซ่อนโหลดแอป
function openProtocol(url) {
  const a = document.createElement("a");
  a.href = url;
  a.target = "_top";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  
  $("vlcNote").innerHTML = "กำลังส่งไปเปิดในแอป... <br><small style='color:var(--muted);'>วิดีโอบนเว็บยังคงเล่นตามปกติ (หากแอปไม่เด้งขึ้นมา แปลว่ายังไม่ได้ติดตั้งแอปนั้นครับ)</small>";
  $("vlcNote").classList.remove("hidden");
}


// 1. ปุ่ม "🎬 เปิดใน drm.player"
$("vlcBtn").onclick = ()=>{
  if(!S.currentSrc) return;
  if (isAndroid) {
    openProtocol(getAndroidIntent("org.drm.player"));
  } else if (isIOS) {
    openProtocol("vlc://" + S.currentSrc);
  } else {
    // บน PC ดาวน์โหลด .m3u
    const m3u=`#EXTM3U\n#EXTINF:-1,${$("playerTitle").textContent}\n${S.currentSrc}\n`;
    const b=new Blob([m3u],{type:"audio/x-mpegurl"}), a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download="play.m3u"; 
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    $("vlcNote").innerHTML="ดาวน์โหลดไฟล์ .m3u แล้ว เปิดด้วย <b>VLC</b> บนเครื่องคอมพิวเตอร์เพื่อรับชม"; 
    $("vlcNote").classList.remove("hidden");
  }
}; 

// 2. ปุ่ม "📱 yamby (แอปอื่น)
$("extBtn").onclick = ()=>{
  if(!S.currentSrc) return;
  if (isAndroid) {
    openProtocol(getAndroidIntent("com.hush.yamby"));
  } else {
    openProtocol(S.currentSrc);
  }
}; 

// 3. ปุ่ม "🖥️ เปิดใน yamby"
$("winBtn").onclick = ()=>{
   if(!S.currentSrc) return;
   openProtocol("xtplay://" + S.currentSrc);
};

// 4. ปุ่ม "📋 คัดลอกลิงก์"
$("copyBtn").onclick=async()=>{ 
  try{ 
    await navigator.clipboard.writeText(S.currentSrc); 
    alert("คัดลอกลิ้งก์สำเร็จแล้ว!"); 
  }catch(e){
    prompt("คัดลอกลิ้งก์ด้านล่าง:", S.currentSrc);
  } 
};
